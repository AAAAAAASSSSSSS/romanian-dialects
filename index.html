<!doctype html>
<html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a5d8f">
<title>Graiuri</title>
<link rel="stylesheet" href="css/style.css"></head>
<body>
<main>
 <header><h1 id="title"></h1><button id="lang" class="small" aria-label="Language / Limba"></button></header>
 <p id="sub" class="muted"></p>
 <section class="card">
  <label id="l-std" for="in"></label>
  <textarea id="in" rows="4"></textarea>
  <button id="sample" class="small ghost"></button>
  <label id="l-dia" for="dia"></label><select id="dia"></select>
 </section>
 <section class="card">
  <div class="out-head"><label id="l-w"></label><span id="h-w" class="muted small-t"></span></div>
  <div class="box" id="w" lang="ro"></div>
  <div class="out-head"><label id="l-p"></label><span id="h-p" class="muted small-t"></span></div>
  <div class="box mono" id="p"></div>
  <details id="legend"><summary id="l-leg"></summary><div id="legend-body"></div></details>
 </section>
 <section class="card" id="info"></section>
 <h2 id="l-c"></h2><div id="c"></div>
 <div class="spacer"></div>
</main>
<nav id="bar" aria-label="Menu"><button id="b-ex" class="bar-btn"></button><button id="b-so" class="bar-btn"></button></nav>
<div id="scrim" hidden></div>
<aside id="panel" role="dialog" aria-modal="true" aria-labelledby="p-title" hidden>
 <div class="p-head"><h2 id="p-title"></h2><button id="p-close" class="small" aria-label="Close">✕</button></div>
 <div id="p-tabs" role="tablist"></div>
 <div id="p-body"></div>
</aside>
<script type="module" src="js/app.js"></script>
</body></html>
